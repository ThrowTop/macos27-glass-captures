name: macOS 27 glass captures

on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: "Comma-separated scenario IDs, smoke, or all"
        required: false
        default: all

jobs:
  capture:
    runs-on: xcode-27
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Environment
        run: |
          sw_vers
          uname -a
          xcodebuild -version
      - name: Build
        run: swift build -c release > build.log 2>&1 || { cat build.log; exit 1; }
      - name: Build toolbar popup feedback probe
        run: mkdir -p out && swiftc -parse-as-library -O -framework AppKit -framework SwiftUI -framework ApplicationServices -framework ImageIO -framework UniformTypeIdentifiers -framework ScreenCaptureKit Sources/ToolbarPopupFeedback/main.swift -o out/ToolbarPopupFeedback
      - name: Capture
        run: |
          if [[ '${{ inputs.scenarios }}' == toolbar-popup-feedback ]]; then
            bash scripts/run-toolbar-popup-feedback.sh
          else
            bash scripts/run-captures.sh '${{ inputs.scenarios }}'
          fi
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos27-captures
          path: |
            out/
            build.log
            ToolbarPopupFeedback.app/
          if-no-files-found: warn
          retention-days: 30
