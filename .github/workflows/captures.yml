name: macOS 27 glass captures

on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: "Comma-separated scenario IDs, smoke, or all"
        required: false
        default: all

jobs:
  capture:
    runs-on: xcode-27
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Environment
        run: |
          sw_vers
          uname -a
          xcodebuild -version
      - name: Build
        run: swift build -c release --product ToolbarOverflowWidth > build.log 2>&1 || { cat build.log; exit 1; }
      - name: Capture
        run: bash scripts/run-toolbar-overflow-width.sh
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toolbar-overflow-width-20261025
          path: |
            out/
            build.log
          if-no-files-found: warn
          retention-days: 30
