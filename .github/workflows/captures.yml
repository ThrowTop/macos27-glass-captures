name: macOS 27 SF Symbols checks

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke, full, s9, s10-overflow, contexts, or all-symbols"
        required: false
        default: smoke

jobs:
  checks:
    runs-on: xcode-27
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Environment
        run: |
          sw_vers
          uname -a
          xcodebuild -version
      - name: Build
        run: |
          if [ '${{ inputs.mode }}' = 's10-overflow' ]; then
            swiftc -O Sources/SFSymbolChecks/s10-overflow.swift -o sf-symbol-checks -framework AppKit -framework SwiftUI -framework CoreGraphics
          elif [ '${{ inputs.mode }}' = 'contexts' ]; then
            swiftc -O Sources/SFSymbolChecks/contexts.swift -o sf-symbol-checks -framework AppKit -framework SwiftUI -framework ScreenCaptureKit -framework ImageIO
          elif [ '${{ inputs.mode }}' = 's9' ] || [ '${{ inputs.mode }}' = 's9-variable' ]; then
            swiftc -O Sources/SFSymbolChecks/s9.swift -o sf-symbol-checks -framework AppKit -framework SwiftUI -framework CoreGraphics -framework CoreText
          else
            swiftc -O Sources/SFSymbolChecks/main.swift -o sf-symbol-checks -framework AppKit -framework SwiftUI -framework CoreGraphics -framework CoreText
          fi
      - name: Run probes
        run: ./sf-symbol-checks '${{ inputs.mode }}'
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sf-symbol-checks
          path: out/
          if-no-files-found: warn
          retention-days: 30
