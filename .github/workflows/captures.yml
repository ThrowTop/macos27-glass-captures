name: macOS 27 SF Symbols checks

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke or full"
        required: false
        default: smoke

jobs:
  checks:
    runs-on: xcode-27
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Environment
        run: |
          sw_vers
          uname -a
          xcodebuild -version
      - name: Build
        run: swiftc -O Sources/SFSymbolChecks/main.swift -o sf-symbol-checks -framework AppKit -framework SwiftUI -framework CoreGraphics -framework CoreUI -framework CoreText
      - name: Run probes
        run: ./sf-symbol-checks '${{ inputs.mode }}'
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sf-symbol-checks
          path: out/
          if-no-files-found: warn
          retention-days: 30
